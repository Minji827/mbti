<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소비습관 테스트 💸</title>
<style>
  :root{
    --card:#ffffff;
    --text:#222222;
    --accent:#222222;
    --good:#2ecc71;
    --normal:#f5a623;
    --bad:#e74c3c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    background:var(--card);
    border:1px solid #eaeaea;
    border-radius:24px;
    max-width:480px;
    width:100%;
    padding:32px 28px;
    box-shadow:0 10px 30px rgba(0,0,0,0.06);
    position:relative;
    overflow:hidden;
  }
  h1{
    font-size:1.6rem;
    text-align:center;
    margin:0 0 6px;
    color:var(--text);
  }
  .subtitle{
    text-align:center;
    color:#888;
    font-size:0.9rem;
    margin-bottom:24px;
  }
  .progress-wrap{
    background:#f0f0f0;
    border-radius:20px;
    height:10px;
    overflow:hidden;
    margin-bottom:24px;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width 0.4s ease;
  }
  .q-number{
    font-size:0.8rem;
    color:var(--accent);
    font-weight:700;
    margin-bottom:8px;
  }
  .question{
    font-size:1.15rem;
    font-weight:700;
    color:var(--text);
    margin-bottom:18px;
    line-height:1.4;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option-btn{
    background:#fafafa;
    border:2px solid #eaeaea;
    border-radius:14px;
    padding:14px 16px;
    text-align:left;
    font-size:0.95rem;
    color:var(--text);
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .option-btn:hover{
    border-color:var(--accent);
    background:#f2f2f2;
    transform:translateX(2px);
  }
  .nav-row{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
  }
  .ghost-btn{
    background:none;
    border:none;
    color:#aaa;
    font-size:0.85rem;
    cursor:pointer;
  }
  .ghost-btn:hover{
    color:var(--accent);
  }
  .start-screen, .result-screen{
    text-align:center;
  }
  .emoji-big{
    font-size:4rem;
    margin-bottom:10px;
    display:block;
  }
  .start-btn, .restart-btn{
    margin-top:20px;
    background:var(--accent);
    border:none;
    color:white;
    font-weight:700;
    font-size:1rem;
    padding:14px 28px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    transition:transform 0.15s ease;
  }
  .start-btn:hover, .restart-btn:hover{
    transform:translateY(-2px) scale(1.03);
  }
  .result-title{
    font-size:1.5rem;
    font-weight:800;
    margin:10px 0 6px;
  }
  .result-badge{
    display:inline-block;
    padding:6px 16px;
    border-radius:20px;
    font-size:0.85rem;
    font-weight:700;
    color:white;
    margin-bottom:16px;
  }
  .result-desc{
    font-size:0.98rem;
    line-height:1.6;
    color:var(--text);
    text-align:left;
    background:#f7f7f9;
    border-radius:16px;
    padding:18px 18px;
    margin-bottom:10px;
  }
  .result-score{
    font-size:0.85rem;
    color:#999;
    margin-bottom:10px;
  }
  .result-img{
    width:220px;
    max-width:70%;
    border-radius:18px;
    margin:4px auto 16px;
    display:block;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
  }
  .hidden{display:none;}
  .intro-list{
    text-align:left;
    font-size:0.88rem;
    color:#777;
    margin-top:14px;
    line-height:1.6;
  }
</style>
</head>
<body>

<div class="card">

  <!-- 시작 화면 -->
  <div id="start-screen" class="start-screen">
    <span class="emoji-big">💸</span>
    <h1>소비습관 테스트</h1>
    <div class="subtitle">당신은 저축왕? 지름신? 그냥 평범한 월급루팡?</div>
    <div class="intro-list">
      ✅ 총 8개 질문, 1분이면 충분해요<br>
      ✅ 정답은 없어요, 그냥 당신의 민망한 진실만 있어요<br>
      ✅ 결과 보고 웃거나 울거나 둘 중 하나입니다
    </div>
    <button class="start-btn" onclick="startQuiz()">테스트 시작하기 →</button>
  </div>

  <!-- 퀴즈 화면 -->
  <div id="quiz-screen" class="hidden">
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="q-number" id="q-number"></div>
    <div class="question" id="question-text"></div>
    <div class="options" id="options-container"></div>
    <div class="nav-row">
      <button class="ghost-btn" onclick="goBack()">← 이전 질문</button>
      <button class="ghost-btn" onclick="restartQuiz()">처음으로</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="result-screen" class="result-screen hidden">
    <span class="emoji-big" id="result-emoji"></span>
    <div class="result-title" id="result-title"></div>
    <div class="result-badge" id="result-badge"></div>
    <img class="result-img" id="result-img" src="" alt="결과 짤">
    <div class="result-score" id="result-score"></div>
    <div class="result-desc" id="result-desc"></div>
    <button class="restart-btn" onclick="restartQuiz()">다시 테스트하기 🔄</button>
  </div>

</div>

<script>
const questions = [
  {
    q: "월급(혹은 용돈)이 들어온 당일, 당신의 심리 상태는?",
    options: [
      { text: "일단 고정비·저축부터 자동이체 걸어놓고 숨 쉰다", score: 4 },
      { text: "조금은 쓰지만 큰 틀에서 계획대로 쓴다", score: 3 },
      { text: "일단 먹고 싶은 거부터 시킨다, 계획은 내일의 나에게", score: 2 },
      { text: "통장이 숨 쉴 틈도 안 주고 바로 '텅장'행 급행열차 탑승", score: 1 },
    ],
  },
  {
    q: "장바구니에 담아둔 물건, 며칠 뒤 다시 보면?",
    options: [
      { text: "3일 이상 지나도 필요하면 산다 (쿨타임 지킴이)", score: 4 },
      { text: "할인할 때만 산다", score: 3 },
      { text: "이미 '구매완료' 문자가 와있다", score: 1 },
      { text: "장바구니는 그냥 거쳐가는 정류장이다, 바로 결제", score: 1 },
    ],
  },
  {
    q: "배달 앱 / 카페 앱 알림이 뜨면?",
    options: [
      { text: "알림 끈 지 오래, 내 눈엔 안 보인다", score: 4 },
      { text: "가끔 보긴 하는데 참을 때가 많다", score: 3 },
      { text: "'오늘만 특별히' 를 거의 매일 외친다", score: 2 },
      { text: "손이 먼저 앱을 열고 있다, 이미 주문 완료", score: 1 },
    ],
  },
  {
    q: "지금 당장 '이번 달 구독 서비스'가 몇 개인지 말할 수 있나요?",
    options: [
      { text: "정확히 몇 개, 얼마 나가는지까지 외우고 있다", score: 4 },
      { text: "대충은 안다, 큰 것들만", score: 3 },
      { text: "글쎄... 넷플릭스는 있는 것 같다", score: 2 },
      { text: "모른다, 그리고 알고 싶지도 않다", score: 1 },
    ],
  },
  {
    q: "친구가 '이거 요즘 핫하대' 하면서 뭔가를 추천하면?",
    options: [
      { text: "필요한지 따져보고 안 필요하면 패스", score: 4 },
      { text: "찜해두고 한번 검색은 해본다", score: 3 },
      { text: "'오 그래?' 하면서 바로 검색창에 입력", score: 2 },
      { text: "말 끝나기도 전에 이미 결제 중", score: 1 },
    ],
  },
  {
    q: "비상금(예상치 못한 지출 대비 자금)에 대해 솔직히 말하면?",
    options: [
      { text: "3~6개월치 생활비는 따로 모아놨다", score: 4 },
      { text: "적지만 조금은 있다", score: 3 },
      { text: "비상금... 그게 뭔가요? 먹는 건가요?", score: 2 },
      { text: "비상금은커녕 다음 월급도 당겨써야 할 판", score: 1 },
    ],
  },
  {
    q: "이번 달 카드값 명세서를 보는 당신의 반응은?",
    options: [
      { text: "예상한 범위 안이라 평온하다", score: 4 },
      { text: "약간 놀라지만 바로 수긍한다 ('맞다 그거 샀지')", score: 3 },
      { text: "'이게 다 뭐지?' 하며 식은땀이 난다", score: 2 },
      { text: "명세서 확인을 미루고 있다, 무서워서 못 본다", score: 1 },
    ],
  },
  {
    q: "스트레스 받는 날, 당신의 셀프 처방은?",
    options: [
      { text: "산책, 운동, 수면 등 돈 안 드는 방법을 먼저 찾는다", score: 4 },
      { text: "소소한 간식 하나 사먹는 정도로 푼다", score: 3 },
      { text: "'플렉스'가 필요해, 작은 지름으로 해소한다", score: 2 },
      { text: "'힐링엔 역시 쇼핑' 이라며 큰 결제가 들어간다", score: 1 },
    ],
  },
];

let currentQ = 0;
let answers = [];

function startQuiz(){
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  currentQ = 0;
  answers = [];
  renderQuestion();
}

function renderQuestion(){
  const total = questions.length;
  const q = questions[currentQ];
  document.getElementById('q-number').textContent = `Q${currentQ+1} / ${total}`;
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('progress-bar').style.width = `${(currentQ/total)*100}%`;

  const container = document.getElementById('options-container');
  container.innerHTML = '';
  q.options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.text;
    btn.onclick = () => selectOption(opt.score);
    container.appendChild(btn);
  });
}

function selectOption(score){
  answers[currentQ] = score;
  if (currentQ < questions.length - 1){
    currentQ++;
    renderQuestion();
  } else {
    showResult();
  }
}

function goBack(){
  if (currentQ > 0){
    currentQ--;
    renderQuestion();
  }
}

function restartQuiz(){
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('start-screen').classList.remove('hidden');
}

function showResult(){
  const total = answers.reduce((a,b)=>a+b,0);
  const max = questions.length * 4;
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  document.getElementById('result-score').textContent = `총점 ${total} / ${max}점`;

  let result;
  if (total >= 26){
    result = {
      emoji: "👑",
      title: "소비습관 甲 (아주 좋음)",
      badgeColor: "var(--good)",
      badgeText: "미래의 이재용 🤫",
      img: "이재용 쉿.jpeg",
      desc: `
        솔직히 말할게요. 당신 주변 사람들 통장 사정을 다 합쳐도
        당신 혼자 이기는 레벨입니다. 😮<br><br>
        충동구매는 당신 사전에 없는 단어고, 비상금은 이미 비상 상황을 대비해
        비상 대기 중이죠. 카드 명세서를 봐도 심장이 평온한 그 능력,
        정말 아무나 가진 게 아닙니다. 이 정도면 "쉿, 비밀인데 나 사실 부자야" 해도 믿을 각.<br><br>
        <b>단 하나의 리스크:</b> 너무 안 쓰다가 가끔은 스스로에게도
        작은 선물 하나쯤 해줘도 됩니다. 아낀 돈, 당신이 쓰라고 있는 거예요 😉
      `,
    };
  } else if (total >= 16){
    result = {
      emoji: "🙂",
      title: "소비습관 보통 (평범)",
      badgeColor: "var(--normal)",
      badgeText: "염.....",
      img: "dja.jpeg",
      desc: `
        극단적으로 아끼지도, 흥청망청 쓰지도 않는 딱 '중간' 라인입니다.
        어떤 날은 계획적이고, 어떤 날은 배달앱 알림에 홀리는 그런 사람이죠. 😅<br><br>
        누가 "너 소비습관 어때?" 라고 물으면 저 고양이처럼
        "염.....( 침묵 )" 하고 눈만 깜빡이게 되는 애매~한 포지션.
        나쁘지 않지만 '이번 달도 뭐 산 것도 없는데 왜 텅장이지?'
        싶은 날이 가끔 있을 뿐입니다.<br><br>
        <b>한 줄 처방:</b> 가계부 앱 하나만 깔아도 등급업 가능성 충분합니다.
      `,
    };
  } else {
    result = {
      emoji: "🔥",
      title: "소비습관 적신호 (안 좋음)",
      badgeColor: "var(--bad)",
      badgeText: "난가? 아... 😭",
      img: "다운로드 (1).jpeg",
      desc: `
        축하합니다, 당신은 지름신의 총애를 받는 소수의 선택된 자입니다. 🙏<br><br>
        장바구니는 당신에게 '숙고의 시간'이 아니라 '결제 직전 정류장'이고,
        월급날의 기쁨은 보통 3일 안에 소멸되는 걸로 유명하죠.
        "가난을 거꾸로 읽으면?" 이라는 질문에 저도 모르게
        "난가...?" 라고 답하게 되는 그 마음, 저희는 압니다.<br><br>
        <b>그래도 희망은 있어요.</b> 지금 이 순간 '아 나 좀 심한가?' 하고
        자각했다는 것 자체가 큰 발전입니다. 일단 알림부터 끄고,
        비상금 10만원부터 시작해봐요. 작게 시작하면 됩니다 💪
      `,
    };
  }

  document.getElementById('result-emoji').textContent = result.emoji;
  document.getElementById('result-title').textContent = result.title;
  const badge = document.getElementById('result-badge');
  badge.textContent = result.badgeText;
  badge.style.background = result.badgeColor;
  document.getElementById('result-img').src = encodeURI(result.img);
  document.getElementById('result-desc').innerHTML = result.desc;
}
</script>

</body>
</html>
